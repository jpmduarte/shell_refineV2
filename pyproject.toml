[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-refine"
version = "2.0"
description = "Fetal head segmentation in 3D ultrasound by size-normalised SDF regression"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["common*", "size_normalization*", "boundary_refiner*"]
